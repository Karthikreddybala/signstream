services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signstream
      POSTGRES_USER: signstream
      POSTGRES_PASSWORD: signstream
    volumes:
      - signstream-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signstream -d signstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting production containers}
      DATABASE_URL: postgresql+psycopg://signstream:signstream@postgres:5432/signstream
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/public/motion:/app/frontend/public/motion:ro
      - signstream-uploads:/app/backend/uploads

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  signstream-postgres:
  signstream-uploads:
